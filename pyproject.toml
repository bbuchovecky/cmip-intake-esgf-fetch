[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmip-intake-esgf-fetch"
version = "0.3.0"
description = "Find CMIP data with intake-esgf, reuse copies already on glade, and catalog it for intake-esm."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Your Name"}]
license = {text = "MIT"}
dependencies = [
  "intake-esgf>=2026.6.4,<2027",  # local.py patches intake_esgf.base.get_local_file
  "pandas>=2.2",
  "pyyaml>=6.0",
  "xarray>=2025.1",
  "netcdf4>=1.7",
  "h5netcdf>=1.3",
  "dask>=2025.1",
  "numpy>=1.26",
  "cftime>=1.6",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest", "intake-esm", "ruff", "mypy"]

[project.scripts]
cmip-intake-fetch = "cmip_intake_esgf_fetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
