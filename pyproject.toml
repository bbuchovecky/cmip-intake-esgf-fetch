[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmip-intake-esgf-fetch"
version = "0.2.0"
description = "Discover, download, and inventory native-grid CMIP5/CMIP6 data using intake-esgf."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Your Name"}]
license = {text = "MIT"}
dependencies = [
  "intake-esgf>=2026.6.4",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "xarray>=2025.1",
  "netcdf4>=1.7",
  "h5netcdf>=1.3",
  "dask>=2025.1",
  "numpy>=1.26",
  "cftime>=1.6",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
cmip-intake-fetch = "cmip_intake_esgf_fetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
